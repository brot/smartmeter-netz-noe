[project]
name = "smartmeter-netz-noe"
version = "0.1.0"
description = "Download meter data from smartmeter.netz-noe.at"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.1",
    "tenacity>=8.2.0",
    "httpx2>=2.0.0",
]

[tool.ruff]
line-length = 120
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.13",
]
