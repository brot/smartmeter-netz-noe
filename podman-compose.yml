services:
  vmsingle:
    image: victoriametrics/victoria-metrics:latest
    container_name: smartmeter-victoriametrics
    ports:
      - "8428:8428" # HTTP API, PromQL, InfluxDB Line Protocol
    volumes:
      - vm-storage:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=10y'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: smartmeter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - vmsingle
    restart: always

volumes:
  grafana_data:
  vm-storage:
